name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/test_stage6_release.py"
      - "tests/test_stage7_windows11_acceptance.py"
      - "main.py"
      - "requirements.txt"
      - "requirements-build.txt"
      - "constraints.lock.txt"
      - "release-tools.json"
      - "THIRD_PARTY_NOTICES.txt"
      - "config.example.json"
      - "ACCEPTANCE_WINDOWS_11.ps1"
      - "UJI_WINDOWS_11.bat"
      - "build_portable.ps1"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/test_stage6_release.py"
      - "tests/test_stage7_windows11_acceptance.py"
      - "main.py"
      - "requirements.txt"
      - "requirements-build.txt"
      - "constraints.lock.txt"
      - "release-tools.json"
      - "THIRD_PARTY_NOTICES.txt"
      - "config.example.json"
      - "ACCEPTANCE_WINDOWS_11.ps1"
      - "UJI_WINDOWS_11.bat"
      - "build_portable.ps1"
      - ".github/workflows/build-windows.yml"

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean checkout
        shell: pwsh
        run: |
          $Dirty = git status --porcelain
          if ($Dirty) {
            Write-Host $Dirty
            throw "Checkout tidak bersih sebelum build."
          }
          git rev-parse HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints.lock.txt

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1"
          pip install -r requirements.txt -c constraints.lock.txt
          pip install -r requirements-build.txt -c constraints.lock.txt
          python --version
          python -m pip --version
          python -c "from importlib.metadata import version; print('PyInstaller==' + version('pyinstaller')); print('yt-dlp==' + version('yt-dlp')); print('yt-dlp-ejs==' + version('yt-dlp-ejs')); print('spotdl==' + version('spotdl'))"

      - name: Test Windows DPAPI key store
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from app.services.secure_keys import WindowsDpapiKeyStore

          root = Path(os.environ["RUNNER_TEMP"]) / "ai-music-downloader-stage6-dpapi"
          store = WindowsDpapiKeyStore(root)
          assert store.available
          fixture = ["stage6-fixture-key-not-real"]
          store.save(fixture)
          encrypted = store.path.read_bytes()
          assert fixture[0].encode("utf-8") not in encrypted
          assert store.load() == fixture
          store.delete()
          assert not store.path.exists()
          print("WINDOWS_DPAPI_SMOKE_OK")
          '@ | python -

      - name: Build and smoke portable ZIP
        shell: pwsh
        run: ./build_portable.ps1

      - name: Verify ZIP checksum sidecar and manifest
        shell: pwsh
        run: |
          $Zip = "release/AI-Music-Downloader-Portable.zip"
          $Checksum = "$Zip.sha256"
          if (-not (Test-Path $Zip) -or -not (Test-Path $Checksum)) {
            throw "ZIP atau checksum sidecar tidak ditemukan."
          }
          $Expected = ((Get-Content $Checksum -Raw) -split '\s+')[0].ToLowerInvariant()
          $Actual = (Get-FileHash $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Expected -ne $Actual) {
            throw "Checksum ZIP final tidak cocok. Expected=$Expected Actual=$Actual"
          }
          Write-Host "FINAL_ZIP_SHA256_OK: $Actual"

      - name: Run packaged Windows acceptance harness in CI mode
        shell: pwsh
        run: |
          $Zip = Resolve-Path "release/AI-Music-Downloader-Portable.zip"
          $Extract = Join-Path $env:RUNNER_TEMP "ai-music-downloader-packaged-acceptance"
          $Report = Join-Path $env:RUNNER_TEMP "acceptance-windows-ci.json"
          if (Test-Path $Extract) { Remove-Item $Extract -Recurse -Force }
          New-Item -ItemType Directory -Path $Extract | Out-Null
          Expand-Archive -Path $Zip -DestinationPath $Extract -Force
          $Package = Join-Path $Extract "AI-Music-Downloader-Portable"
          $Acceptance = Join-Path $Package "ACCEPTANCE_WINDOWS_11.ps1"
          $Launcher = Join-Path $Package "UJI_WINDOWS_11.bat"
          if (-not (Test-Path $Acceptance) -or -not (Test-Path $Launcher)) {
            throw "Acceptance harness tidak ikut di ZIP portable."
          }
          & $Acceptance -CiMode -OutputPath $Report
          if ($LASTEXITCODE -ne 0) {
            throw "Acceptance harness dari ZIP gagal dengan exit code $LASTEXITCODE"
          }
          $Result = Get-Content $Report -Raw | ConvertFrom-Json
          if (-not $Result.automated_passed) {
            throw "Acceptance report tidak berstatus automated_passed=true"
          }
          Write-Host "PACKAGED_WINDOWS_ACCEPTANCE_HARNESS_OK"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Music-Downloader-Portable
          path: |
            release/AI-Music-Downloader-Portable.zip
            release/AI-Music-Downloader-Portable.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
