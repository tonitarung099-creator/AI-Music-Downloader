name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python files
        run: python -m compileall -q .

      - name: UI smoke test
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from app.ui.main_window_v2 import MainWindow

          app = QApplication([])
          window = MainWindow()
          assert window.windowTitle() == "AI Music Downloader"
          window.close()
          print("UI_SMOKE_OK")
          PY

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
