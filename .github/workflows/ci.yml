name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Record runtime versions
        run: |
          python --version
          python -m pip --version
          python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version

          for package in ("PySide6", "yt-dlp", "spotdl", "yt-dlp-ejs", "pytest"):
              try:
                  value = version(package)
              except PackageNotFoundError:
                  value = "NOT_INSTALLED"
              print(f"{package}=={value}")
          PY

      - name: Compile Python files
        run: python -m compileall -q .

      - name: UI smoke test - production facade
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from app.ui.production_window import MainWindow

          app = QApplication([])
          window = MainWindow()
          assert window.windowTitle() == "AI Music Downloader"
          assert window.minimumWidth() <= 960
          assert window.agent_toggle_btn.text() in {"Sembunyikan Gemini", "Tampilkan Gemini"}
          window.close()
          print("UI_PRODUCTION_SMOKE_OK")
          PY

      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rxX
